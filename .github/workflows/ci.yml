name: CI

on:
  push:
    branches: [main, build]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: |
          go vet ./...
          go vet -tags nosytest ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest -tags nosytest ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.26", "1.27"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Test
        shell: bash
        run: |
          race=""
          if [ "$(go env CGO_ENABLED)" = 1 ] && { command -v gcc || command -v clang; } >/dev/null; then
            race="-race"
          fi
          go test $race -count=1 ./...

  # The planted-page tests drive the Chrome that is already on the runner.
  # They are built with the nosytest tag and switched on by NOSY_BROWSER_TESTS.
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: google-chrome
            parallel: "4"
          - os: windows-latest
            chrome: C:\Program Files\Google\Chrome\Application\chrome.exe
            parallel: "4"
          - os: macos-latest
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
            parallel: "3"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NOSY_BROWSER_TESTS: "1"
      NOSY_CHROME: ${{ matrix.chrome }}
      NOSY_PARALLEL: ${{ matrix.parallel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false
      - name: Browser version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -Command "(Get-Item '$NOSY_CHROME').VersionInfo.ProductVersion"
          else
            "$NOSY_CHROME" --version
          fi
      # the Linux runner blocks the browser's sandbox for unprivileged users
      - name: Allow the browser without its sandbox
        if: runner.os == 'Linux'
        run: echo "NOSY_NO_SANDBOX=1" >> "$GITHUB_ENV"
      # the safety tests plant listeners on loopback port 80 and 127.0.0.2
      # port 80 that the scan must never reach
      - name: Open loopback port 80 for the canaries
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Add the second loopback address
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Planted-page tests
        shell: bash
        run: |
          set -o pipefail
          race=""
          if [ "$(go env CGO_ENABLED)" = 1 ] && { command -v gcc || command -v clang; } >/dev/null; then
            race="-race"
          fi
          echo "race flag: '${race}'"
          go test -tags nosytest $race -count=1 -v ./... 2>&1 | tee test.log
      - name: Check the browser tests ran
        shell: bash
        run: |
          for t in TestControlStaysSilent TestFingerprintPlants TestKeyCapturePlants TestPrivateAddressesNeverReached TestSharedBrowserLeaksNothingBetweenScans TestWorkerRequestsAreCaptured; do
            grep -q -- "--- PASS: $t " test.log || { echo "$t did not run and pass"; exit 1; }
          done
          echo "skipped:"; grep -- "--- SKIP" test.log || true
      - name: Time one real scan
        if: runner.os != 'Windows'
        run: |
          for url in https://www.wikipedia.org/ https://www.bbc.com/; do
            NOSY_TIMING_URL="$url" go test -tags nosytest -count=1 -v -run TestTimingOfOneRealScan ./internal/integration
          done

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
