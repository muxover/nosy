name: CI

on:
  push:
    branches: [main, build]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: |
          go vet ./...
          go vet -tags nosytest ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags nosytest ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.26", "1.27"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Test
        shell: bash
        run: |
          race=""
          if [ "$(go env CGO_ENABLED)" = 1 ] && { command -v gcc || command -v clang; } >/dev/null; then
            race="-race"
          fi
          go test $race -count=1 ./...
          go test -count=1 -tags nosytest ./internal/guard
      # a short run in CI; a longer one by hand: go test -fuzz=FuzzAddressCheck -fuzztime=10m ./internal/guard
      - name: Fuzz the address check
        if: matrix.os == 'ubuntu-latest'
        run: go test -run '^$' -fuzz=FuzzAddressCheck -fuzztime=30s ./internal/guard

  # The planted-page tests, on each system with the Chrome already on the runner
  # (system) and with Nosy's own pinned Chrome for Testing, installed by
  # `nosy browser install` (pinned). They are built with the nosytest tag and
  # switched on by NOSY_BROWSER_TESTS. The pinned jobs download the browser from
  # Google; nothing else in CI touches the outside.
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, source: system, chrome: google-chrome, parallel: "4"}
          - {os: ubuntu-latest, source: pinned, parallel: "4"}
          - {os: windows-latest, source: system, chrome: 'C:\Program Files\Google\Chrome\Application\chrome.exe', parallel: "4"}
          - {os: windows-latest, source: pinned, parallel: "4"}
          - {os: macos-latest, source: system, chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome, parallel: "3"}
          - {os: macos-latest, source: pinned, parallel: "3"}
    name: browser (${{ matrix.os }}, ${{ matrix.source }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      NOSY_BROWSER_TESTS: "1"
      NOSY_CHROME: ${{ matrix.chrome }}
      NOSY_PARALLEL: ${{ matrix.parallel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false
      # Ubuntu 24.04 stops unprivileged programs from making the user namespaces
      # Chrome's sandbox needs. The sandbox stays on; the runner is told to allow it.
      - name: Allow the browser's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # the safety tests plant listeners on loopback port 80 and 127.0.0.2
      # port 80 that the scan must never reach
      - name: Open loopback port 80 for the canaries
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Add the second loopback address
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Install the pinned Chrome
        if: matrix.source == 'pinned'
        shell: bash
        run: |
          go run ./cmd/nosy browser install
          echo "NOSY_CHROME=$(go run ./cmd/nosy browser path | head -n 1)" >> "$GITHUB_ENV"
          echo "NOSY_EXPECT_PINNED=1" >> "$GITHUB_ENV"
      - name: Doctor
        shell: bash
        run: |
          go run ./cmd/nosy browser path
          go run ./cmd/nosy doctor
      - name: Time one browser start
        shell: bash
        run: |
          chrome="${NOSY_CHROME:-${{ matrix.chrome }}}"
          for i in 1 2 3; do
            start=$(date +%s)
            "$chrome" --headless=new --disable-gpu --user-data-dir="$RUNNER_TEMP/probe$i" --dump-dom about:blank >/dev/null 2>&1 || echo "exit $?"
            echo "start $i took $(( $(date +%s) - start ))s"
          done
      - name: One scan with the pinned build
        if: matrix.source == 'pinned'
        shell: bash
        run: go test -p 1 -timeout 4m -tags nosytest -count=1 -v -run TestThePinnedBuildIsUsedWhenNothingElseIsSet ./cmd/nosy
      - name: Planted-page tests
        shell: bash
        run: |
          set -o pipefail
          race=""
          if [ "$(go env CGO_ENABLED)" = 1 ] && { command -v gcc || command -v clang; } >/dev/null; then
            race="-race"
          fi
          echo "race flag: '${race}'"
          go test -p 1 -timeout 25m -tags nosytest $race -count=1 -v ./... 2>&1 | tee test.log
      - name: Check the browser tests ran
        shell: bash
        run: |
          required="TestControlStaysSilent TestNoWayOutReachesTheLocalNetwork TestAllowPrivateOpensTheLocalNetworkButNotMetadata TestRefusesBeforeScanning TestRedirectsToPrivateAddressAreDropped TestFingerprintPlants TestKeyCapturePlants TestPrivateAddressesNeverReached TestTwoScansShareNothing TestCrossSiteFramesAreWatched TestFramesDoingNothingWrongStayQuiet TestPopUpsAreClosedAndReported TestDownloadsAreRefused TestEveryPermissionRequestIsDenied TestLocalAddressesAreNeverOpened TestHSTSIsNotRemembered TestProfileIsRemovedAfterEveryEnding TestProfilesLeftByACrashAreClearedByTheNextScan TestStorageReadCutShortIsSaid TestConditionsRecordIsolationAndWebGL TestWorkerRequestsAreCaptured TestStorageIsCapturedPerOrigin TestScanDeviceAndGPC TestInterruptStopsTheBrowserAndExits130"
          if [ "${{ matrix.source }}" = pinned ]; then
            required="$required TestThePinnedBuildIsUsedWhenNothingElseIsSet"
          fi
          for t in $required; do
            grep -q -- "--- PASS: $t " test.log || { echo "$t did not run and pass"; exit 1; }
          done
          echo "skipped:"; grep -- "--- SKIP" test.log || true

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
