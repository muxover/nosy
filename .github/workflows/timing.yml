name: Timing

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public page to scan once and time
        required: true
        default: https://www.wikipedia.org/

permissions:
  contents: read

jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: google-chrome
          - os: macos-latest
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NOSY_BROWSER_TESTS: "1"
      NOSY_CHROME: ${{ matrix.chrome }}
      NOSY_TIMING_URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false
      - name: Allow the browser's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Time one scan
        run: go test -tags nosytest -count=1 -v -run TestTimingOfOneRealScan ./internal/integration
